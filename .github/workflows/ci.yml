name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      scope:
        description: "changed | all（all=全量复测，用于口径变更后重跑）"
        required: false
        default: "changed"

# 加密（2026-11）：具备外部抓取能力的脚本（URL 可达性校验/回填、Overpass、
# GitHub API 工具）入库即密文（encrypted/*.enc + encryption/manifest.tsv），
# 运行时经 prep.sh 先验后写解密、用毕 clean。钥匙来自 Secret: CODE_KEY。
# workflow YAML 本身无法加密（GitHub 只从明文 YAML 调度）。
# inputs.scope 一律 env 中转 + ci/step.sh 内 changed|all 白名单，不直插 run:。

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install jsonschema
        run: pip install jsonschema

      - name: Step 1/3 verify ciphertext (verify-only, zero writes)
        env:
          OOEP_PASSPHRASE: ${{ secrets.CODE_KEY }}
        run: bash encryption/logrun.sh 1/3 bash encryption/prep.sh 1

      - name: Step 2/3 materialize fetchers
        env:
          OOEP_PASSPHRASE: ${{ secrets.CODE_KEY }}
        run: bash encryption/logrun.sh 2/3 bash encryption/prep.sh 2

      # Schema + trilingual completeness/quality + in-station dedup +
      # distance/walk_min consistency + fixed radius + index consistency
      # + floor_check (medical 硬规则) + URL reachability sample.
      # URL 口径：404/410=死链判红；0/403/429/502/503=runner-blocked，warn+逐条计数不判红；
      #           本地 200 证据读 url_ledger.json 输出 local_status。见 scripts/validate.py。
      - name: Step 3/3 Validate station files
        env:
          OOEP_PASSPHRASE: ${{ secrets.CODE_KEY }}
          GH_EVENT_BEFORE: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          SCOPE: ${{ github.event.inputs.scope || 'changed' }}
        run: bash encryption/logrun.sh 3/3 bash ci/step.sh validate 3

      - name: Remove plaintext fetchers
        run: python3 encryption/decrypt.py clean --out .

      - name: Finalize (cleanup + worktree assertion)
        if: always()
        run: bash encryption/finalize.sh

  upgrade-pending-urls:
    # Retest official_url_pending URLs from the runner (full internet, no
    # local anti-bot blocks); on HTTP 200 rewrite url and commit back.
    # R3 上锁：每轮 ≤20 条；只改 url/source/official_url_pending 三字段；
    # 提交前 validate.py --all 必须通过；一次 commit；失败不重试；绝不 force；
    # commit message 列出改动 POI id。见 scripts/upgrade_urls.py。
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    concurrency:
      group: upgrade-pending-urls   # 串行化，避免并行回填互相覆盖
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install jsonschema
        run: pip install jsonschema

      - name: Step 1/3 verify ciphertext (verify-only, zero writes)
        env:
          OOEP_PASSPHRASE: ${{ secrets.CODE_KEY }}
        run: bash encryption/logrun.sh 1/3 bash encryption/prep.sh 1

      - name: Step 2/3 materialize fetchers
        env:
          OOEP_PASSPHRASE: ${{ secrets.CODE_KEY }}
        run: bash encryption/logrun.sh 2/3 bash encryption/prep.sh 2

      - name: Step 3/3 Upgrade pending official URLs (locked)
        env:
          OOEP_PASSPHRASE: ${{ secrets.CODE_KEY }}
        run: bash encryption/logrun.sh 3/3 bash ci/step.sh upgrade 3

      - name: Remove plaintext fetchers
        run: python3 encryption/decrypt.py clean --out .

      - name: Finalize (cleanup + worktree assertion)
        if: always()
        run: bash encryption/finalize.sh
